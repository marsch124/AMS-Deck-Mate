name: AMSDeckMate
options:
  bundleIdPrefix: com.schabbauer
  deploymentTarget:
    macOS: "15.0"
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  DeckMateCore:
    path: Core
targets:
  AMSDeckMate:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - path: App/Resources
        excludes:
          - AppIcon.icns
          - Icons
      - path: App/Resources/Icons
        type: folder
        buildPhase: resources
    info:
      path: App/Config/Info.plist
      properties:
        CFBundleDisplayName: AMS Deck Mate
        CFBundleShortVersionString: "0.11.1"
        CFBundleVersion: "19"
        CFBundleIconFile: AppIcon
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSAppleEventsUsageDescription: AMS Deck Mate asks other apps to quit or open only when a key of yours says so.
        NSLocalNetworkUsageDescription: AMS Deck Mate offers your keys to your iPhone when it is close by.
        NSCalendarsFullAccessUsageDescription: AMS Deck Mate shows your next event on a key. It only reads your calendar and never changes it.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSBonjourServices: [_amsdeckmate._tcp, _amsdeckdirect._tcp]
    settings:
      base:
        PRODUCT_NAME: AMS Deck Mate
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.schabbauer.AMSDeckMate
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.11.1"
        CURRENT_PROJECT_VERSION: "19"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: D24ENP83QQ
        ENABLE_HARDENED_RUNTIME: NO
    dependencies:
      - package: DeckMateCore
  AMSDeckMatePhone:
    type: application
    platform: iOS
    sources:
      - Phone/Sources
      - Phone/Resources
    info:
      path: Phone/Config/Info.plist
      properties:
        CFBundleDisplayName: Deck Mate
        CFBundleShortVersionString: "0.16"
        CFBundleVersion: "21"
        ITSAppUsesNonExemptEncryption: false
        CFBundleIconName: AppIcon
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: Deck Mate finds your Mac close by to show its keys.
        NSBonjourServices: [_amsdeckmate._tcp, _amsdeckdirect._tcp]
    settings:
      base:
        PRODUCT_NAME: Deck Mate
        PRODUCT_BUNDLE_IDENTIFIER: com.schabbauer.AMSDeckMatePhone
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.16"
        CURRENT_PROJECT_VERSION: "21"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: D24ENP83QQ
    dependencies:
      - package: DeckMateCore
  AMSDeckMatePhoneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Phone/UITests]
    settings:
      base:
        TEST_TARGET_NAME: AMSDeckMatePhone
        DEVELOPMENT_TEAM: D24ENP83QQ
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AMSDeckMatePhone
schemes:
  Deck Mate iPhone:
    build:
      targets:
        AMSDeckMatePhone: all
    test:
      targets:
        - AMSDeckMatePhoneUITests
        - package: DeckMateCore/DeckMateCoreTests
    archive:
      config: Release
  AMS Deck Mate:
    build:
      targets:
        AMSDeckMate: all
    run:
      config: Release
