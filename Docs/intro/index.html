<meta charset="utf-8">

<style>
/* Layout: chapter rail on the left, coach + a pretend Mac desktop on the right. Reusable tour engine: LESSONS + a small simulator. */
:root {
  --bg: #F6F5F9; --panel: #FFFFFF; --fg: #1E1B2E; --muted: #6A6680; --line: #E3E0EC;
  --accent: #534AB7; --accent-soft: #EEEDFE; --good: #3B6D11; --good-soft: #EAF3DE; --warn: #993C1D;
  --desk-a: #C9D6E3; --desk-b: #E8DCCB; --menubar: rgba(255,255,255,.72); --menubar-fg: #1E1B2E;
  --win: #FFFFFF; --win-bar: #F2F1F5; --win-fg: #1E1B2E; --shadow: 0 18px 40px rgba(30,27,46,.18);
  --purple-fill:#EEEDFE; --purple-title:#3C3489; --purple-text:#26215C; --purple-mark:#534AB7;
  --coral-fill:#FAECE7; --coral-title:#712B13; --coral-text:#4A1B0C; --coral-mark:#993C1D;
  --blue-fill:#E6F1FB; --blue-title:#0C447C; --blue-text:#042C53; --blue-mark:#185FA5;
  --green-fill:#EAF3DE; --green-title:#27500A; --green-text:#173404; --green-mark:#3B6D11;
  --key-bg:#FFFFFF;
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Figtree", -apple-system, "Segoe UI", sans-serif;
  --f-mac: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#15131F; --panel:#1F1C2C; --fg:#EEEDF5; --muted:#A29EB8; --line:#322E44;
  --accent:#AFA9EC; --accent-soft:#2B2650; --good:#97C459; --good-soft:#22331A; --warn:#F0997B;
  --desk-a:#1F2C3D; --desk-b:#3A2F3A; --menubar: rgba(30,28,40,.75); --menubar-fg:#EEEDF5;
  --win:#26232F; --win-bar:#2F2C39; --win-fg:#EEEDF5; --shadow: 0 18px 40px rgba(0,0,0,.5);
  --purple-fill:#3C3489; --purple-title:#CECBF6; --purple-text:#EEEDFE; --purple-mark:#AFA9EC;
  --coral-fill:#712B13; --coral-title:#F5C4B3; --coral-text:#FAECE7; --coral-mark:#F0997B;
  --blue-fill:#0C447C; --blue-title:#B5D4F4; --blue-text:#E6F1FB; --blue-mark:#85B7EB;
  --green-fill:#27500A; --green-title:#C0DD97; --green-text:#EAF3DE; --green-mark:#97C459;
  --key-bg: rgba(0,0,0,.28); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg:#15131F; --panel:#1F1C2C; --fg:#EEEDF5; --muted:#A29EB8; --line:#322E44;
  --accent:#AFA9EC; --accent-soft:#2B2650; --good:#97C459; --good-soft:#22331A; --warn:#F0997B;
  --desk-a:#1F2C3D; --desk-b:#3A2F3A; --menubar: rgba(30,28,40,.75); --menubar-fg:#EEEDF5;
  --win:#26232F; --win-bar:#2F2C39; --win-fg:#EEEDF5; --shadow: 0 18px 40px rgba(0,0,0,.5);
  --purple-fill:#3C3489; --purple-title:#CECBF6; --purple-text:#EEEDFE; --purple-mark:#AFA9EC;
  --coral-fill:#712B13; --coral-title:#F5C4B3; --coral-text:#FAECE7; --coral-mark:#F0997B;
  --blue-fill:#0C447C; --blue-title:#B5D4F4; --blue-text:#E6F1FB; --blue-mark:#85B7EB;
  --green-fill:#27500A; --green-title:#C0DD97; --green-text:#EAF3DE; --green-mark:#97C459;
  --key-bg: rgba(0,0,0,.28); color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 230px minmax(0,1fr); gap: 22px; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none }

/* Rail */
.rail { display: flex; flex-direction: column; gap: 4px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); align-self: start; }
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.brand .tile { width: 40px; height: 40px; border-radius: 10px; background: #534AB7; color: #fff; display: grid; place-items: center; }
.brand .tile svg { width: 26px; height: 26px }
.brand h1 { font-family: var(--f-display); font-size: 19px; line-height: 1.1; margin: 0; text-wrap: balance }
.brand small { color: var(--muted); font-size: 12px }
.chap { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 9px; border: 0; background: none; color: var(--fg); font: inherit; text-align: left; cursor: pointer; }
.chap:hover { background: var(--accent-soft) }
.chap:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.chap .n { color: var(--muted); font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums }
.chap.cur { background: var(--accent-soft); color: var(--accent); font-weight: 600 }
.chap.done .n { color: var(--good) }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin: 10px 2px 2px }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s }
.railnote { color: var(--muted); font-size: 12px; margin: 4px 2px }

/* Coach */
.main { display: flex; flex-direction: column; gap: 14px; min-width: 0 }
.coach { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px 16px; align-items: center; }
.coach .eyebrow { grid-column: 1 / -1; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); font-weight: 600; display: flex; gap: 8px; align-items: center }
.coach .eyebrow .kind { color: var(--muted); font-weight: 500 }
.coach h2 { font-family: var(--f-display); font-size: 23px; line-height: 1.2; margin: 0; text-wrap: balance }
.coach p { margin: 4px 0 0; color: var(--fg); max-width: 62ch }
.coach .btns { display: flex; gap: 8px; align-items: center }
.btn { font: inherit; font-weight: 600; border-radius: 9px; padding: 8px 16px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer }
.btn.main-b { background: #534AB7; border-color: #534AB7; color: #fff }
.btn.main-b:disabled { opacity: .45; cursor: default }
.btn.ghost { border-color: transparent; color: var(--muted) }
.answers { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px }
.ans { font: inherit; padding: 8px 14px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer }
.ans:hover { border-color: var(--accent) }
.ans.right { border-color: var(--good); background: var(--good-soft); color: var(--good); font-weight: 600 }
.ans.wrong { border-color: var(--warn); color: var(--warn); text-decoration: line-through }
.feedback { grid-column: 1 / -1; font-weight: 600; color: var(--good); min-height: 1.4em; margin: 0 }
.feedback.no { color: var(--warn) }
.legend { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px }
.legend button { font: inherit; display: flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 9px; padding: 5px 12px 5px 6px; cursor: pointer }
.legend button.seen { border-color: var(--good) }
.legend .kc { font-family: var(--f-mac); font-size: 16px; min-width: 28px; height: 28px; display: grid; place-items: center; border-radius: 6px; background: var(--accent-soft); color: var(--accent); font-weight: 600 }
.legend span.nm { color: var(--muted); min-width: 4.5em }
.legend .seen span.nm { color: var(--good); font-weight: 600 }

/* Stage = pretend Mac */
.stagebox { position: relative; width: 100%; aspect-ratio: 960 / 560; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow); max-width: 100% }
.stage { position: absolute; left: 0; top: 0; width: 960px; height: 560px; transform-origin: 0 0; font-family: var(--f-mac); font-size: 13px; color: var(--win-fg);
  background: radial-gradient(120% 90% at 15% 10%, var(--desk-b), transparent 60%), linear-gradient(160deg, var(--desk-a), var(--desk-b)); }
.mbar { position: absolute; inset: 0 0 auto; height: 26px; background: var(--menubar); backdrop-filter: blur(10px); display: flex; align-items: center; gap: 18px; padding: 0 14px; color: var(--menubar-fg); font-size: 13px; z-index: 30 }
.mbar b { font-weight: 700 }
.mbar .sp { flex: 1 }
.mbar .kicon { width: 30px; height: 22px; display: grid; place-items: center; border-radius: 5px; border: 0; background: none; color: inherit; cursor: pointer; padding: 0 }
.mbar .kicon.open, .mbar .kicon:hover { background: rgba(127,127,127,.25) }
.mbar .kicon svg { width: 17px; height: 17px }
.menu { position: absolute; top: 28px; right: 108px; width: 250px; background: var(--win); border-radius: 9px; box-shadow: var(--shadow); padding: 5px; z-index: 40; border: 1px solid var(--line) }
.menu button, .menu .info { display: flex; width: 100%; align-items: center; gap: 6px; border: 0; background: none; color: var(--win-fg); font: inherit; text-align: left; padding: 4px 8px; border-radius: 5px; cursor: pointer }
.menu button:hover { background: #534AB7; color: #fff }
.menu .chk { width: 14px; text-align: center }
.menu .sc { margin-left: auto; opacity: .55 }
.menu .info { color: var(--muted); cursor: default }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px }

.strip { position: absolute; left: 0; right: 0; bottom: 18px; display: flex; justify-content: center; align-items: flex-end; gap: 10px; z-index: 5 }
.win { position: absolute; background: var(--win); border-radius: 11px; box-shadow: var(--shadow); border: 1px solid var(--line); overflow: hidden; z-index: 20 }
.win .tb { height: 30px; background: var(--win-bar); display: flex; align-items: center; gap: 7px; padding: 0 11px; font-weight: 600; font-size: 12.5px }
.win .tb .dots { display: flex; gap: 6px; margin-right: 8px }
.win .tb .dots i { width: 11px; height: 11px; border-radius: 50%; background: #E0605A; display: block }
.win .tb .dots i:nth-child(2) { background: #E6B53F } .win .tb .dots i:nth-child(3) { background: #5DBB5A }
.win .tb .ttl { flex: 1; text-align: center; margin-right: 50px; color: var(--muted) }
.cover { left: 80px; top: 60px; width: 800px; height: 470px; transition: transform .6s cubic-bezier(.3,.7,.2,1); cursor: grab }
/* Deck Mate pretend screen */
:root, .stage { --k-app:#2F6FD6; --k-web:#14908F; --k-raycast:#E2512F; --k-shortcut:#7A55C9; --k-text:#C98208; --k-media:#2E9A4F; --k-move:#5C7388; }
.mbar .front { font-weight: 700 }
.menu { right: 108px; width: 270px }
.menu .hd { color: var(--muted); padding: 4px 8px 0; cursor: default; font-size: 12px }
.menu .ind { padding-left: 22px }
.appwin { position: absolute; left: 24px; width: 176px; height: 104px; border-radius: 10px; background: var(--win); border: 1px solid var(--line); box-shadow: var(--shadow); overflow: hidden; cursor: pointer; z-index: 2 }
.appwin.front { border: 2px solid var(--accent); z-index: 3 }
.appwin .tb { height: 24px; font-size: 11.5px }
.appwin .tb .dots i { width: 9px; height: 9px }
.appwin .ln { height: 8px; border-radius: 4px; background: var(--line); margin: 11px 14px }
.appwin .nm { position: absolute; right: 8px; bottom: 6px; font-size: 11px; color: var(--muted) }
.keys-win { position: absolute; background: var(--win); border-radius: 13px; box-shadow: var(--shadow); border: 1px solid var(--line); z-index: 12; padding: 8px 12px 12px }
.keys-win .top { display: flex; align-items: center; gap: 6px; height: 24px; font-weight: 600; font-size: 12.5px }
.keys-win .top .held { font-weight: 500; font-size: 11px; color: var(--accent) }
.keys-win .top .sp { flex: 1 }
.keys-win .top button { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 2px; display: grid; place-items: center; border-radius: 5px }
.keys-win .top button:hover { background: var(--accent-soft) }
.keys-win .top svg { width: 16px; height: 16px }
.kgrid { display: grid }
.kt { border: 0; padding: 0; border-radius: 12px; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; font-family: var(--f-mac); font-weight: 600; text-align: center; line-height: 1.1; overflow: hidden }
.kt svg { fill: none; stroke: #fff; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round }
.kt.app { background: var(--k-app) } .kt.web { background: var(--k-web) } .kt.raycast { background: var(--k-raycast) } .kt.shortcut { background: var(--k-shortcut) }
.kt.text { background: var(--k-text) } .kt.media { background: var(--k-media) } .kt.move { background: var(--k-move) }
.kt.empty { background: transparent; border: 1.5px dashed var(--line); cursor: default }
.kt:hover:not(.empty) { filter: brightness(1.08) }
.dock-hint { position: absolute; right: 16px; bottom: 14px; z-index: 6; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted) }
.dock-hint button { font: 600 13px var(--f-mac); border: 1px solid var(--line); background: var(--win); color: var(--win-fg); border-radius: 8px; padding: 5px 10px; cursor: pointer; letter-spacing: .08em }
.phone { position: absolute; right: 26px; top: 40px; width: 200px; height: 440px; border-radius: 30px; border: 6px solid #1E1B2E; background: var(--win); box-shadow: var(--shadow); z-index: 8; padding: 22px 8px 10px; display: flex; flex-direction: column; align-items: center; overflow: hidden }
:root[data-theme="dark"] .phone { border-color: #55506B }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .phone { border-color: #55506B } }
.phone .pl { font-size: 12px; font-weight: 600; margin-bottom: 8px; text-align: center }
.phone .msg { margin: auto 0; text-align: center; padding: 0 8px; font-size: 12px; color: var(--muted) }
.phone .msg b { display: block; color: var(--win-fg); font-size: 14px; margin-bottom: 6px }
.phone .msg button { margin-top: 10px; font: 600 13px var(--f-body); background: var(--accent); color: var(--bg); border: 0; border-radius: 9px; padding: 7px 14px; cursor: pointer }
.pgrid { margin: auto 0 }
.win.setup { left: 40px; top: 40px; width: 880px; height: 470px; z-index: 20; display: flex; flex-direction: column }
.setup .cols { flex: 1; display: grid; grid-template-columns: 190px minmax(0,1fr) 270px; gap: 0; min-height: 0 }
.setup .col { padding: 10px 12px; border-right: 1px solid var(--line); overflow: hidden }
.setup .col:last-child { border-right: 0 }
.setup h4 { margin: 0 0 6px; font-size: 14px }
.setup .pr { padding: 3px 8px; border-radius: 6px; font-size: 12.5px; cursor: default }
.setup .pr small { display: block; color: var(--muted); font-size: 10.5px }
.setup .pr.on { background: var(--green-fill); color: var(--green-title) }
.setup .tabsrow { display: flex; gap: 5px; margin-bottom: 8px; flex-wrap: wrap }
.setup .tabsrow span { padding: 2px 9px; border-radius: 12px; font-size: 11.5px; background: var(--accent-soft) }
.setup .tabsrow span.on { background: var(--accent); color: var(--bg); font-weight: 600 }
.setup .lab { display: block; color: var(--muted); font-size: 11px; margin: 8px 0 2px }
.setup input, .setup select { font: inherit; font-size: 12.5px; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--win-bar); color: var(--win-fg); width: 100%; min-width: 0 }
.setup .prob { color: #C0392B; min-height: 1.2em; font-size: 11.5px; margin: 6px 0 }
.setup .bt { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap }
.setup .sfoot { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted) }
.setup .sfoot .sp { flex: 1 }
.mbtn.prim { background: #534AB7; border-color: #534AB7; color: #fff }
.mbtn { font: inherit; font-size: 12.5px; padding: 4px 11px; border-radius: 6px; border: 1px solid var(--line); background: var(--win-bar); color: var(--win-fg); cursor: pointer }
.win.settings { left: 28px; top: 36px; width: 470px; height: 490px; z-index: 20; display: flex; flex-direction: column }
.settings .pane { flex: 1; overflow: hidden; padding: 8px 16px }
.settings .card2 { border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; margin-bottom: 7px }
.settings .card2 h5 { margin: 0 0 5px; font-size: 13px; color: var(--green-mark) }
.settings .row2 { display: flex; align-items: center; gap: 6px; margin: 4px 0; font-size: 12.5px; flex-wrap: wrap }
.settings .row2 .lb { width: 70px; color: var(--muted) }
.settings .ch { border: 1px solid var(--line); background: var(--win-bar); color: var(--win-fg); font: inherit; font-size: 12px; padding: 3px 10px; border-radius: 12px; cursor: pointer }
.settings .ch.on { background: var(--green-mark); border-color: var(--green-mark); color: var(--bg); font-weight: 600 }
.settings .cb { display: flex; gap: 7px; align-items: center; border: 0; background: none; color: var(--win-fg); font: inherit; font-size: 12.5px; cursor: pointer; padding: 2px 0; text-align: left }
.settings .cb i { width: 15px; height: 15px; border-radius: 4px; border: 1.5px solid var(--muted); display: grid; place-items: center; font-style: normal; font-size: 11px; line-height: 1; flex: none }
.settings .cb.on i { background: var(--green-mark); border-color: var(--green-mark); color: var(--bg) }
.settings .nt { color: var(--muted); font-size: 11px; margin: 2px 0 0 }
.settings .sfoot { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted) }
.settings .sfoot .sp { flex: 1 }
.settings .tabs2 { display: flex; justify-content: center; gap: 2px; padding: 8px }
.settings .tabs2 span { font-size: 12.5px; padding: 3px 10px; border-radius: 6px }
.settings .tabs2 span.on { background: #E6B53F; color: #1E1B2E; font-weight: 600 }
.alert { position: absolute; left: 50%; top: 96px; transform: translateX(-50%); width: 320px; background: var(--win); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 16px; z-index: 45; text-align: center }
.alert b { display: block; margin-bottom: 4px; font-size: 13.5px }
.alert p { margin: 0 0 12px; color: var(--muted); font-size: 12px }
.alert .r { display: flex; gap: 8px; justify-content: center }
.swatches { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px }
.swatches span { display: flex; align-items: center; gap: 7px; border: 1.5px solid var(--line); border-radius: 9px; padding: 4px 11px 4px 5px; font-size: 13.5px }
.swatches i { width: 22px; height: 22px; border-radius: 6px; display: block }
.target { position: relative; z-index: 2; animation: ring 1.6s ease-in-out infinite; border-radius: 7px }
@keyframes ring { 0%,100% { box-shadow: 0 0 0 2px #E6B53F, 0 0 0 6px rgba(230,181,63,.35) } 50% { box-shadow: 0 0 0 2px #E6B53F, 0 0 0 11px rgba(230,181,63,0) } }
@keyframes pop { from { transform: translateY(8px); opacity: .3 } to { transform: none; opacity: 1 } }
.toast { position: absolute; left: 50%; top: 40px; transform: translateX(-50%); background: var(--good); color: #fff; font: 600 14px var(--f-body); padding: 7px 14px; border-radius: 20px; z-index: 50; animation: pop .3s }
:root[data-theme="dark"] .toast { color: #15131F }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .toast { color: #15131F } }

/* Finish */
.finish { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px }
.finish h3 { font-family: var(--f-display); margin: 0 0 8px; font-size: 19px }
.finish label { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; border-top: 1px solid var(--line); cursor: pointer }
.finish input { width: 18px; height: 18px; accent-color: #534AB7; margin-top: 2px; flex: none }

@media (max-width: 820px) {
  .wrap { grid-template-columns: minmax(0,1fr) }
  .rail { position: static; flex-direction: row; flex-wrap: wrap; gap: 4px }
  .brand { width: 100% }
  .chap .n { display: none }
  .railnote, .bar { width: 100% }
  .coach { grid-template-columns: minmax(0,1fr) }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important } }
</style>

<div class="wrap">
  <nav class="rail" id="rail" aria-label="Chapters"></nav>
  <main class="main">
    <section class="coach" id="coach" aria-live="polite"></section>
    <div class="stagebox" id="stagebox"><div class="stage" id="stage"></div></div>
    <section class="finish" id="finish" hidden></section>
  </main>
</div>

function keyTile(k, i, kw, fs, gl, pre) {
  if (!k) return pre === 'su-key' ? `<button class="kt empty" style="width:${kw}px;height:${kw}px;cursor:pointer" data-act="su-key" data-i="${i}" data-t="su-slot-${i}" aria-label="Empty key ${i + 1}"></button>`
    : `<span class="kt empty" style="width:${kw}px;height:${kw}px" aria-label="Empty key"></span>`;
  return `<button class="kt ${k.kind}" style="width:${kw}px;height:${kw}px;font-size:${fs}px" data-act="${pre}" data-i="${i}" data-t="${pre === 'pkey' ? 'pkey' : 'key'}-${esc(k.t)}" aria-label="${esc(k.t)}">
    <svg viewBox="0 0 24 24" style="width:${gl}px;height:${gl}px"><path d="${ICON[k.ic]}"/></svg><span>${esc(k.t)}</span></button>`;
}
function grid(keys, kw, gap, fs, gl, pre) {
  return `<div class="kgrid" style="grid-template-columns:repeat(5,${kw}px);gap:${gap}px">${keys.map((k, i) => keyTile(k, i, kw, fs, gl, pre)).join('')}</div>`;
}

          : `<h4 style="color:var(--purple-mark)">Key</h4><div style="color:var(--muted);font-size:12.5px">Click one of the 15 keys to give it a title, an icon and something to do.</div>`}</div>
      </div>
      <div class="sfoot"><span>Changes are kept as you make them. Every earlier state stays as a safety copy.</span><span class="sp"></span><button class="mbtn prim" data-act="su-done" data-t="su-done">Done</button></div></div>`;

    settings = `<div class="win settings" data-t="settings"><div class="tb"><span class="dots"><i data-act="settings-done"></i><i></i><i></i></span><span class="ttl">AMS Deck Mate</span></div>
      <div class="tabs2"><span class="on">Settings</span><span>How it works</span><span>What’s new</span></div>
      <div class="pane">
        <div class="card2"><h5>The box</h5><div class="row2">Not plugged in</div><div class="nt">Not yet tried on the real box. The keys on screen work without it.</div></div>
        <div class="card2"><h5>Keys on screen</h5>
          <div class="row2"><span class="lb">Show them</span>${ch('place-left', 'Where I left them', S.place === 'left', 'placeLeft')}${ch('place-pointer', 'At the mouse pointer', S.place === 'pointer', 'placePointer')}</div>
          <div class="row2"><span class="lb">Size</span>${ch('size-small', 'Small', S.size === 'small', 'size-small')}${ch('size-normal', 'Normal', S.size === 'normal', 'size-normal')}${ch('size-large', 'Large', S.size === 'large', 'size-large')}</div>
          <button class="cb ${S.hide ? 'on' : ''}" data-act="hide-toggle" data-t="hideAfter"><i>${S.hide ? '✓' : ''}</i>Hide after a key is pressed</button>
          <div class="nt">Control-Option-D shows or hides them. A folder, Back or a page key never hides them: you are not done yet.</div></div>
        <div class="card2"><h5>iPhone</h5><div class="cb on"><i>✓</i>Let an iPhone use these keys</div><div class="nt">On the same Wi-Fi it finds the Mac by itself. The first time, this Mac asks whether to allow it.</div></div>

function toast(t) { S.toast = t; renderStage(); clearTimeout(toast.h); toast.h = setTimeout(() => { S.toast = ''; renderStage(); }, 1500); }

function showKeys(on) { S.keysShown = on; S.menu = false; renderStage(); if (on) emit('shown'); }
function toggleKeys() { showKeys(!S.keysShown); }
function setFront(n) {
  S.front = n; S.menu = false;
  if (!S.held) { S.page = 'p1'; renderStage(); emit('front', n); } else { renderStage(); emit('stayed', n); }
}
function pressKey(k, src) {
  if (!k) return;
  if (k.kind === 'move') {
    if (k.to === 'back') { S.page = curPage().parent || 'p1'; renderStage(); emit('back'); }
    else { S.page = k.to; renderStage(); emit('open', k.t); }
    return;
  }
  if (src === 'phone') { emit('tap', k.t); toast('Mac: ' + k.say); return; }
  emit('press', k.t); toast(k.say);
  if (S.hide) { S.keysShown = false; renderStage(); emit('hid'); }
}

/* Clicks inside the pretend Mac and iPhone */
document.getElementById('stage').addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) { if (S.menu) { S.menu = false; renderStage(); } return; }
  const a = el.dataset.act;
  if (a !== 'kicon' && !a.startsWith('m-') && S.menu) S.menu = false;
  switch (a) {
    case 'kicon': S.menu = !S.menu; renderStage(); if (S.menu) emit('menu'); break;
    case 'm-show': toggleKeys(); break;
    case 'm-setup': case 'open-setup': S.menu = false; S.setup = true; S.suProfile = prof(); S.suPage = S.page; S.su = { slot: null }; renderStage(); emit('setup'); break;
    case 'm-settings': S.menu = false; S.settings = true; renderStage(); emit('settings'); break;
    case 'm-auto': S.held = null; S.page = 'p1'; S.menu = false; renderStage(); emit('auto'); break;
    case 'm-prof': S.held = el.dataset.p; S.page = 'p1'; S.menu = false; renderStage(); emit('pin', el.dataset.p); break;
    case 'm-none': S.menu = false; renderStage(); break;
    case 'hide-keys': S.keysShown = false; renderStage(); break;
    case 'kkey': pressKey(curPage().keys[+el.dataset.i], 'mac'); break;
    case 'pkey': pressKey(curPage().keys[+el.dataset.i], 'phone'); break;
    case 'front': setFront(el.dataset.app); break;
    case 'kbd': toggleKeys(); break;
    case 'place-left': S.place = 'left'; renderStage(); break;
    case 'place-pointer': S.place = 'pointer'; renderStage(); emit('pointer'); break;
    case 'size-small': case 'size-normal': case 'size-large': S.size = a.slice(5); renderStage(); emit('size', S.size); break;
    case 'hide-toggle': S.hide = !S.hide; renderStage(); if (S.hide) emit('hideon'); break;
    case 'settings-done': S.settings = false; renderStage(); break;
    case 'allow': S.alert = false; S.phone = 'on'; renderStage(); emit('allow'); break;
    case 'deny': S.alert = false; S.phone = 'denied'; renderStage(); break;
    case 'ask-again': S.phone = 'ask'; S.alert = true; renderStage(); break;
    case 'su-prof': S.suProfile = el.dataset.p; S.suPage = 'p1'; S.su = { slot: null }; renderStage(); break;
    case 'su-key': { const pg = S.deck[S.suProfile][S.suPage in S.deck[S.suProfile] ? S.suPage : 'p1'], i = +el.dataset.i, k = pg.keys[i];
      S.su = { slot: i, title: k ? k.t : '', kind: k ? k.kind : 'none', problem: '' }; renderStage(); emit('pickkey'); break; }
    case 'su-cancel': S.su = { slot: null }; renderStage(); break;
    case 'su-save': saveKey(); break;
    case 'su-done': S.setup = false; S.su = null; renderStage(); break;
  }
});
document.getElementById('stage').addEventListener('mousemove', ev => {

  S.pointer = { x: (ev.clientX - r.left) / sc, y: (ev.clientY - r.top) / sc };
});
document.getElementById('stage').addEventListener('input', ev => { if (S.su && ev.target.id === 'su-title') S.su.title = ev.target.value; });
document.getElementById('stage').addEventListener('change', ev => { if (S.su && ev.target.id === 'su-kind') S.su.kind = ev.target.value; });
document.getElementById('stage').addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && S.su && S.su.slot !== null) { S.su = { slot: null }; renderStage(); }
  if (ev.key === 'Enter' && S.su && S.su.slot !== null) { ev.preventDefault(); saveKey(); }
});
document.addEventListener('keydown', ev => { if (ev.ctrlKey && ev.altKey && (ev.code === 'KeyD' || ev.key.toLowerCase() === 'd')) { ev.preventDefault(); toggleKeys(); } });

function saveKey() {
  const e = S.su, title = (e.title || '').trim();
  if (!title) e.problem = 'Give the key a title.';
  else if (e.kind !== 'text') e.problem = 'Pick “Type text” under “What it does”.';
  if (e.problem) { renderStage(); emit('problem'); return; }
  const pf = S.deck[S.suProfile], id = S.suPage in pf ? S.suPage : 'p1';
  pf[id].keys[e.slot] = K(title, 'text', 'text', 'Types your text');
  S.su = { slot: null }; renderStage(); emit('saved', title);
}

    { kind: 'try', head: 'It follows the Mac', text: 'Click the Notion window on the Mac.', target: 'win-Notion', wait: 'front', match: 'Notion', setup: () => { S.keysShown = true; S.phone = 'on'; S.alert = false; S.front = 'Finder'; S.held = null; S.page = 'p1'; }, ok: 'The iPhone changed to the Notion profile with the Mac.' },

/* ---------- Tour engine (reusable) ---------- */
let ci = 0, si = 0, solved = false, targetOff = false;
const store = { get(k) { try { return localStorage.getItem(k) } catch { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch {} } };
let doneChapters = new Set(JSON.parse(store.get('deckmate-done') || '[]'));

function emit(name, data) {
  const st = LESSONS[ci]?.steps[si]; if (!st || solved || st.kind !== 'try') return;
  if (name === 'menu' && st.menuTarget) { markTarget(st.menuTarget); return; }
  if ((st.wait === name || st.alt === name) && (st.match === undefined || st.match === data)) succeed(st.ok);
  else if (name === 'menu' && st.reopenMenu) markTarget(st.target);
}
function succeed(msg) {
  solved = true; targetOff = true; const fb = document.getElementById('fb'); if (fb) { fb.textContent = '✓ ' + msg; fb.className = 'feedback'; }
  const nx = document.getElementById('next'); if (nx) { nx.disabled = false; nx.focus({ preventScroll: true }); }
}
let curTarget = null;
function markTarget(t) {
  if (t !== undefined) curTarget = t;
  document.querySelectorAll('.target').forEach(e => e.classList.remove('target'));
  if (!curTarget || targetOff) return;
  let el = document.querySelector(`#stage [data-t="${CSS.escape(curTarget)}"]`);
  if (!el && curTarget.startsWith('m-')) el = document.querySelector('#stage [data-t="kicon"]');
  if (el) el.classList.add('target');
}
function renderRail() {
  const total = LESSONS.reduce((n, l) => n + l.steps.length, 0);
  const before = LESSONS.slice(0, ci).reduce((n, l) => n + l.steps.length, 0) + si;
  document.getElementById('rail').innerHTML = `<div class="brand"><span class="tile">${icon('keycap')}</span><div><h1>Deck Mate Tour</h1><small>Learn the app in about 8 minutes</small></div></div>
    ${LESSONS.map((l, i) => `<button class="chap ${i === ci ? 'cur' : ''} ${doneChapters.has(i) ? 'done' : ''}" data-ch="${i}">${icon(l.icon)}<span>${l.title}</span><span class="n">${doneChapters.has(i) ? '✓' : l.steps.length + ' steps'}</span></button>`).join('')}
    <button class="chap ${ci === LESSONS.length ? 'cur' : ''}" data-ch="${LESSONS.length}">${icon('trophy')}<span>On your Mac</span></button>
    <div class="bar"><i style="width:${Math.round(100 * Math.min(before, total) / total)}%"></i></div>
    <p class="railnote">Everything here is a practice copy. Nothing changes on your Mac.</p>`;
}
document.getElementById('rail').addEventListener('click', e => { const b = e.target.closest('[data-ch]'); if (b) goChapter(+b.dataset.ch); });

function goChapter(i) {
  ci = i; si = 0; S = START();
  // Bring the pretend Mac to where that chapter starts.
  S.keysShown = i >= 1 && i !== 5;
  renderStep();
}

function renderStep() {
  renderRail();
  const coach = document.getElementById('coach'), fin = document.getElementById('finish');
  if (ci >= LESSONS.length) { renderFinish(); coach.hidden = true; return; }
  coach.hidden = false; fin.hidden = true;
  const L = LESSONS[ci], st = L.steps[si];
  solved = st.kind === 'look'; targetOff = false;
  S.menu = false;
  if (st.setup) st.setup();
  S.toast = '';
  const kindName = { look: 'Look', try: 'Try it', check: 'Check' }[st.kind];
  coach.innerHTML = `<div class="eyebrow">${icon(L.icon)} ${esc(L.title)} <span class="kind">· ${kindName} · step ${si + 1} of ${L.steps.length}</span></div>
    <div><h2>${esc(st.head)}</h2><p>${esc(st.text)}</p>${st.hint ? `<p style="color:var(--muted);font-size:13px">${esc(st.hint)}</p>` : ''}</div>
    <div class="btns">${ci + si > 0 ? '<button class="btn ghost" id="back">Back</button>' : ''}<button class="btn main-b" id="next" ${solved ? '' : 'disabled'}>${si === L.steps.length - 1 ? 'Finish chapter' : 'Next'}</button></div>
    ${st.swatches ? `<div class="swatches">${SWATCH.map(([k, n, c]) => `<span><i style="background:var(--k-${k})"></i>${n} · ${c}</span>`).join('')}</div>` : ''}
    ${st.kind === 'check' ? `<div class="answers">${st.answers.map((a, i) => `<button class="ans" data-a="${i}">${esc(a)}</button>`).join('')}</div>` : ''}
    <p class="feedback" id="fb"></p>`;
  curTarget = st.target || null;
  renderStage();
  if (st.kind === 'check') coach.querySelectorAll('.ans').forEach(b => b.onclick = () => {
    const fb = document.getElementById('fb');
    if (+b.dataset.a === st.right) { coach.querySelectorAll('.ans').forEach(x => x.disabled = true); b.classList.add('right'); succeed(st.ok); }
    else { b.classList.add('wrong'); fb.textContent = 'Not quite. Try another answer.'; fb.className = 'feedback no'; }
  });
  document.getElementById('next').onclick = next;
  const bk = document.getElementById('back'); if (bk) bk.onclick = back;
}
function next() {
  const L = LESSONS[ci];
  if (si < L.steps.length - 1) { si++; renderStep(); return; }
  doneChapters.add(ci); store.set('deckmate-done', JSON.stringify([...doneChapters]));
  ci++; si = 0; renderStep();
}
function back() { if (si > 0) { si--; solved = true; renderStep(); } else if (ci > 0) { goChapter(ci - 1); } }

function renderFinish() {
  const fin = document.getElementById('finish'); fin.hidden = false;
  S = START(); S.keysShown = true; curTarget = null; renderStage();
  const items = ['Click the key icon in your menu bar and choose "Show keys on screen". (If you cannot see the icon, Tidy Bar may have tucked it away.)',
    'Open "Set up keys…" and click one key to see its Title, Icon and "What it does".',
    'Pick a profile in the menu, then choose "Automatic" so the keys follow the app in front.',
    'Open Deck Mate on your iPhone on the same Wi-Fi, and click Allow on your Mac when it asks.'];
  let ticks = JSON.parse(store.get('deckmate-real') || '[]');
  fin.innerHTML = `<h3>Now try it on your real Mac</h3>${items.map((t, i) => `<label><input type="checkbox" id="real-${i}" ${ticks.includes(i) ? 'checked' : ''}><span>${esc(t)}</span></label>`).join('')}
    <p style="color:var(--muted);font-size:13px;margin:10px 0 0">When you plug in your Stream Deck, quit Elgato's app first. Settings then shows "Connected".</p>
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn main-b" id="again">Start the tour again</button></div>`;
  fin.querySelectorAll('input').forEach((c, i) => c.onchange = () => { ticks = ticks.filter(x => x !== i); if (c.checked) ticks.push(i); store.set('deckmate-real', JSON.stringify(ticks)); });
  document.getElementById('again').onclick = () => goChapter(0);
}

/* Fit the 960×560 pretend Mac into its box */
function fit() { const box = document.getElementById('stagebox'); document.getElementById('stage').style.transform = `scale(${box.clientWidth / 960})`; }
new ResizeObserver(fit).observe(document.getElementById('stagebox'));
document.addEventListener('keydown', e => { if (e.key === 'Enter' && !(S.su && S.su.slot !== null) && e.target.tagName !== 'INPUT') { const n = document.getElementById('next'); if (n && !n.disabled && document.activeElement !== n) n.click(); } });
renderStep(); fit();
</script>
